name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DevPulse.slnx

      - name: Build
        run: dotnet build DevPulse.slnx --no-restore -c Release

      # Les tests d'intégration démarrent PostgreSQL et RabbitMQ réels via Testcontainers (Docker présent sur le runner).
      - name: Test
        run: dotnet test DevPulse.slnx --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/devpulse-web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/devpulse-web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  # Les images réelles, démarrées ensemble, puis les parcours navigateur et une mesure de charge contre elles.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Secrets jetables
        shell: pwsh
        run: |
          ./infrastructure/scripts/make-env.ps1
          # Cible de démonstration et boîte à webhooks sur le réseau Docker.
          Add-Content .env 'ALLOW_PRIVATE_TARGETS=true'
          Add-Content .env 'AUTH_PERMIT_PER_MINUTE=200'

      - name: Construction des images
        run: docker compose --profile apps build

      - name: Démarrage
        run: |
          docker compose --profile apps up -d --wait --wait-timeout 180 postgres rabbitmq redis observability
          docker compose --profile apps up -d
          # Images sans shell : la disponibilité se vérifie de l'extérieur, par la passerelle et le front.
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8080/api/auth/login || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ || true)
            if [ "$code" = "400" ] && [ "$web" = "200" ]; then echo "Prêt après $((i*2)) s"; break; fi
            sleep 2
          done
          docker compose --profile apps ps

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/DevPulse.E2ETests/package-lock.json

      - name: Parcours navigateur
        working-directory: tests/DevPulse.E2ETests
        env:
          BASE_URL: http://localhost:5173
          GATEWAY_URL: http://localhost:8080
          DEMO_URL: http://localhost:5020
          DEMO_TARGET_URL: http://demo:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Charge (k6)
        run: |
          # Même utilisateur que le runner : k6 doit pouvoir écrire son résumé dans le dossier monté.
          docker run --rm --network host --user "$(id -u):$(id -g)" -e GATEWAY_URL=http://localhost:8080 -e DEMO_TARGET_URL=http://demo:8080 \
            -v "$PWD/tests/load:/scripts" grafana/k6:1.8.1 run --summary-export /scripts/summary.json /scripts/dashboard.js
          {
            echo '### Charge : 20 utilisateurs, 30 s, sur le runner GitHub'
            echo '| Point de terminaison | Moyenne | Médiane | P95 | P99 |'
            echo '|---|---|---|---|---|'
            for endpoint in overview services; do
              jq -r --arg e "$endpoint" '.metrics["http_req_duration{endpoint:" + $e + "}"] | "| \($e) | \(.avg|floor) ms | \(.med|floor) ms | \(.["p(95)"]|floor) ms | \(.["p(99)"]|floor) ms |"' tests/load/summary.json
            done
            jq -r '"Requêtes : \(.metrics.http_reqs.count), échecs : \(.metrics.http_req_failed.value * 100) %"' tests/load/summary.json
          } >> "$GITHUB_STEP_SUMMARY"

      # Les mesures produites pendant les parcours et la charge doivent être arrivées jusqu'à Prometheus et Tempo,
      # et Grafana doit avoir chargé le tableau de bord et les règles d'alerte du dépôt.
      - name: Supervision de la plateforme
        run: |
          sleep 20   # dernier envoi des métriques (toutes les 15 s)
          names=$(curl -sf http://localhost:9090/api/v1/label/__name__/values | jq -r '.data[]')
          missing=0
          for metric in devpulse_checks_total devpulse_check_duration_milliseconds_bucket devpulse_outages_detected_total \
                        devpulse_messaging_published_total devpulse_messaging_consumed_total devpulse_outbox_oldest_age_seconds \
                        devpulse_incidents_opened_total devpulse_incidents_resolved_total \
                        devpulse_alerts_deliveries_total devpulse_alerts_notification_latency_milliseconds_bucket \
                        http_server_request_duration_seconds_bucket; do
            if echo "$names" | grep -qx "$metric"; then echo "reçue : $metric"; else echo "ABSENTE : $metric"; missing=1; fi
          done
          echo "--- noms DevPulse vus par Prometheus"; echo "$names" | grep '^devpulse_' || true
          p95=$(curl -sf --data-urlencode 'query=histogram_quantile(0.95, sum by (le) (devpulse_alerts_notification_latency_milliseconds_bucket))' \
            http://localhost:9090/api/v1/query | jq -r '.data.result[0].value[1] // "aucune"')
          echo "Délai de notification P95 (Prometheus) : $p95 ms"
          services=$(curl -sf http://localhost:3200/api/search/tag/service.name/values | jq -r '.tagValues[]?' | sort | tr '\n' ' ')
          echo "Services vus par Tempo : $services"
          for service in api-gateway identity-service incident-service alerting-service monitoring-worker ai-worker; do
            echo "$services" | grep -qw "$service" || { echo "AUCUNE TRACE : $service"; missing=1; }
          done
          title=$(curl -sf http://localhost:3000/api/dashboards/uid/devpulse | jq -r '.dashboard.title' || curl -sf -u admin:admin http://localhost:3000/api/dashboards/uid/devpulse | jq -r '.dashboard.title')
          echo "Tableau de bord Grafana : $title"
          [ "$title" = "DevPulse : plateforme" ] || missing=1
          rules=$(curl -sf http://localhost:3000/api/v1/provisioning/alert-rules | jq -r '.[].uid' || curl -sf -u admin:admin http://localhost:3000/api/v1/provisioning/alert-rules | jq -r '.[].uid')
          echo "Règles d'alerte chargées : $(echo $rules)"
          [ "$(echo "$rules" | grep -c '^devpulse-')" = "5" ] || missing=1
          {
            echo '### Supervision'
            echo "Délai de notification P95 mesuré par Prometheus : $p95 ms"
            echo
            echo "Services tracés : $services"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $missing

      - name: Journaux des services
        if: always()
        run: docker compose --profile apps logs --no-color > compose-logs.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: |
            compose-logs.txt
            tests/DevPulse.E2ETests/test-results/
            tests/load/summary.json
            docs/screenshots/
          retention-days: 7

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      # Validation seulement : aucun accès à AWS depuis la CI, aucun plan n'est calculé.
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  terraform-azure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform-azure
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      # Validation seulement : aucun accès à Azure depuis la CI.
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate