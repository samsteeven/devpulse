name: Publier les images

# Lancé à la main uniquement (onglet Actions) : rien n'est publié par un simple push.
# Images : ghcr.io/<propriétaire>/devpulse-<service>:<sha court>, et :latest en plus si demandé.
on:
  workflow_dispatch:
    inputs:
      latest:
        description: "Étiqueter aussi « latest »"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: identity, project: src/Services/Identity/DevPulse.Identity.Api }
          - { service: registry, project: src/Services/Registry/DevPulse.Registry.Api }
          - { service: monitoring-api, project: src/Services/Monitoring/DevPulse.Monitoring.Api }
          - { service: monitoring-worker, project: src/Services/Monitoring/DevPulse.Monitoring.Worker }
          - { service: incident, project: src/Services/Incident/DevPulse.Incident.Api }
          - { service: alerting, project: src/Services/Alerting/DevPulse.Alerting.Api }
          - { service: ai-worker, project: src/Services/AI/DevPulse.AI.Worker }
          - { service: gateway, project: src/Gateway/DevPulse.Gateway }
          - { service: web, project: "" }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes
        id: tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/devpulse-${{ matrix.service }}"
          tags="${image}:${GITHUB_SHA::7}"
          if [ "${{ inputs.latest }}" = "true" ]; then tags="${tags},${image}:latest"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service == 'web' && 'apps/web/devpulse-web' || '.' }}
          file: ${{ matrix.service == 'web' && 'apps/web/devpulse-web/Dockerfile' || 'infrastructure/docker/dotnet.Dockerfile' }}
          build-args: ${{ matrix.project != '' && format('PROJECT={0}', matrix.project) || '' }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Relie le paquet au dépôt : il hérite de sa description et apparaît sur sa page.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  summary:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Images publiées avec l'étiquette \`${GITHUB_SHA::7}\` : à passer comme \`image_tag\` au Terraform." >> "$GITHUB_STEP_SUMMARY"
          echo "Les paquets héritent de la visibilité du dépôt : publics ici. Depuis un dépôt privé, fournir des identifiants au Terraform." >> "$GITHUB_STEP_SUMMARY"
