name: devpulse

# Infrastructure locale. Tous les ports sont publiés sur 127.0.0.1 uniquement.
# Les variables « ?: » font échouer le démarrage plutôt que de partir sans mot de passe.
x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  Jwt__PublicKey: ${JWT_PUBLIC_KEY}
  Database__MigrateOnStartup: "true"
  RabbitMq__Host: rabbitmq
  RabbitMq__User: ${RABBITMQ_USER:-devpulse}
  RabbitMq__Password: ${RABBITMQ_PASSWORD}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  # La cible de démonstration est sur le réseau Docker : autorisé ici, jamais en production.
  TargetPolicy__AllowPrivateTargets: ${ALLOW_PRIVATE_TARGETS:-false}
  # Le cookie Secure n'est pas renvoyé sur http://127.0.0.1 par tous les navigateurs ; en local seulement.
  Auth__SecureCookie: ${SECURE_COOKIE:-true}

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: devpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Lancer infrastructure/scripts/make-env.ps1}
      POSTGRES_DB: postgres
    ports:
      # 5432 refusé par Windows sur certains postes : le port publié se règle dans .env.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Vise la dernière base créée par le script d'initialisation : sain seulement quand elle existe vraiment.
      test: ["CMD-SHELL", "psql -U \"$${POSTGRES_USER}\" -d devpulse_alerting -c 'select 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    container_name: devpulse-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-devpulse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Lancer infrastructure/scripts/make-env.ps1}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.12-alpine
    container_name: devpulse-redis
    restart: unless-stopped
    # Le mot de passe vient de l'environnement du conteneur : il n'est pas écrit dans sa commande de démarrage.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Lancer infrastructure/scripts/make-env.ps1}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Lancer infrastructure/scripts/make-env.ps1}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: devpulse-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/docker/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  # --- Applications (profil « apps ») : docker compose --profile apps up -d --build ---------------------------
  # Les images n'ont pas de shell (chiseled) : pas de healthcheck interne. La CI attend la passerelle de l'extérieur.

  identity:
    profiles: [apps]
    build: { context: ., dockerfile: infrastructure/docker/dotnet.Dockerfile, args: { PROJECT: src/Services/Identity/DevPulse.Identity.Api } }
    image: devpulse/identity:local
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      <<: *app-env
      ConnectionStrings__Database: Host=postgres;Database=devpulse_identity;Username=${POSTGRES_USER:-devpulse};Password=${POSTGRES_PASSWORD}
      Jwt__PrivateKey: ${JWT_PRIVATE_KEY}

  registry:
    profiles: [apps]
    build: { context: ., dockerfile: infrastructure/docker/dotnet.Dockerfile, args: { PROJECT: src/Services/Registry/DevPulse.Registry.Api } }
    image: devpulse/registry:local
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      <<: *app-env
      ConnectionStrings__Database: Host=postgres;Database=devpulse_registry;Username=${POSTGRES_USER:-devpulse};Password=${POSTGRES_PASSWORD}
      InternalApi__Key: ${INTERNAL_API_KEY}

  monitoring-api:
    profiles: [apps]
    build: { context: ., dockerfile: infrastructure/docker/dotnet.Dockerfile, args: { PROJECT: src/Services/Monitoring/DevPulse.Monitoring.Api } }
    image: devpulse/monitoring-api:local
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
    environment:
      <<: *app-env
      ConnectionStrings__Database: Host=postgres;Database=devpulse_monitoring;Username=${POSTGRES_USER:-devpulse};Password=${POSTGRES_PASSWORD}

  monitoring-worker:
    profiles: [apps]
    build: { context: ., dockerfile: infrastructure/docker/dotnet.Dockerfile, args: { PROJECT: src/Services/Monitoring/DevPulse.Monitoring.Worker } }
    image: devpulse/monitoring-worker:local
    restart: unless-stopped
    depends_on: [monitoring-api, registry]
    environment:
      <<: *app-env
      ConnectionStrings__Database: Host=postgres;Database=devpulse_monitoring;Username=${POSTGRES_USER:-devpulse};Password=${POSTGRES_PASSWORD}
      InternalApi__Key: ${INTERNAL_API_KEY}
      Registry__BaseUrl: http://registry:8080/
      Monitoring__SyncIntervalSeconds: "5"
      Database__MigrateOnStartup: "false"

  incident:
    profiles: [apps]
    build: { context: ., dockerfile: infrastructure/docker/dotnet.Dockerfile, args: { PROJECT: src/Services/Incident/DevPulse.Incident.Api } }
    image: devpulse/incident:local
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
    environment:
      <<: *app-env
      ConnectionStrings__Database: Host=postgres;Database=devpulse_incident;Username=${POSTGRES_USER:-devpulse};Password=${POSTGRES_PASSWORD}

  alerting:
    profiles: [apps]
    build: { context: ., dockerfile: infrastructure/docker/dotnet.Dockerfile, args: { PROJECT: src/Services/Alerting/DevPulse.Alerting.Api } }
    image: devpulse/alerting:local
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy }, redis: { condition: service_healthy } }
    environment:
      <<: *app-env
      ConnectionStrings__Database: Host=postgres;Database=devpulse_alerting;Username=${POSTGRES_USER:-devpulse};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD},abortConnect=false

  ai-worker:
    profiles: [apps]
    build: { context: ., dockerfile: infrastructure/docker/dotnet.Dockerfile, args: { PROJECT: src/Services/AI/DevPulse.AI.Worker } }
    image: devpulse/ai-worker:local
    restart: unless-stopped
    depends_on: { rabbitmq: { condition: service_healthy } }
    environment:
      <<: *app-env
      # Rules par défaut ; Llm avec Ai__BaseUrl, Ai__Model et Ai__ApiKey pour un modèle compatible OpenAI.
      Ai__Provider: ${AI_PROVIDER:-Rules}
      Ai__BaseUrl: ${AI_BASE_URL:-}
      Ai__Model: ${AI_MODEL:-}
      Ai__ApiKey: ${AI_API_KEY:-}

  gateway:
    profiles: [apps]
    build: { context: ., dockerfile: infrastructure/docker/dotnet.Dockerfile, args: { PROJECT: src/Gateway/DevPulse.Gateway } }
    image: devpulse/gateway:local
    restart: unless-stopped
    depends_on: [identity, registry, monitoring-api, incident, alerting]
    environment:
      <<: *app-env
      ReverseProxy__Clusters__identity__Destinations__main__Address: http://identity:8080/
      ReverseProxy__Clusters__registry__Destinations__main__Address: http://registry:8080/
      ReverseProxy__Clusters__monitoring__Destinations__main__Address: http://monitoring-api:8080/
      ReverseProxy__Clusters__incident__Destinations__main__Address: http://incident:8080/
      ReverseProxy__Clusters__alerting__Destinations__main__Address: http://alerting:8080/
      ForwardedHeaders__TrustedNetworks__0: 172.16.0.0/12
      RateLimiting__AuthPermitPerMinute: ${AUTH_PERMIT_PER_MINUTE:-20}
    ports:
      - "127.0.0.1:8080:8080"

  web:
    profiles: [apps]
    build: { context: apps/web/devpulse-web }
    image: devpulse/web:local
    restart: unless-stopped
    depends_on: [gateway]
    ports:
      - "127.0.0.1:5173:8080"

  # Fausse API à surveiller et boîte à webhooks, pour la démonstration et les tests de bout en bout.
  demo:
    profiles: [apps]
    build: { context: ., dockerfile: infrastructure/docker/dotnet.Dockerfile, args: { PROJECT: infrastructure/demo/DevPulse.DemoTarget } }
    image: devpulse/demo:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:5020:8080"

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
